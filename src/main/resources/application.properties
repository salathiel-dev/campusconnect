spring.application.name=campusconnect-api

# =======================================
# CONFIGURAÇÃO DO BANCO DE DADOS (POSTGRESQL)
# =======================================

# URL de conexão JDBC para o PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/campusconnect_db

# Usuário e senha do seu banco de dados PostgreSQL
spring.datasource.username=postgres
spring.datasource.password=Campus2025@

# =======================================
# CONFIGURAÇÃO DO HIBERNATE/JPA
# =======================================

# Dialeto específico para o PostgreSQL, para que o JPA saiba "falar" com o banco
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Ação a ser tomada no schema do banco de dados ao iniciar a aplicação
# 'update': O Hibernate tentará atualizar o schema (criar/alterar tabelas) com base nas suas entidades Java.
# Ótimo para desenvolvimento. Para produção, usa-se 'validate' ou 'none'.
spring.jpa.hibernate.ddl-auto=update

# Mostra no console o SQL que o Hibernate está a executar por baixo dos panos.
# Muito útil para depuração durante o desenvolvimento.
spring.jpa.show-sql=true

# Formata o SQL exibido no console para ser mais legível.
spring.jpa.properties.hibernate.format_sql=true

# Chave secreta para assinatura dos tokens JWT
# Em um projeto real, isso deve vir de uma variável de ambiente!
api.security.token.secret=minha-chave-secreta-super-dificil