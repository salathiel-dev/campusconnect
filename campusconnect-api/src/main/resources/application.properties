spring.application.name=campusconnect-api

# =======================================
# CONFIGURACAO DO SERVIDOR
# =======================================
server.port=8081

# =======================================
# CONFIGURACAO DO BANCO DE DADOS (POSTGRESQL)
# =======================================

# URL de conexao JDBC para o PostgreSQL
# spring.datasource.url=jdbc:postgresql://localhost:5432/campusconnect_db
# spring.datasource.username=postgres
# spring.datasource.password=Campus2025@

# =======================================
# CONFIGURACAO DO HIBERNATE/JPA
# =======================================

# Dialeto especifico para o PostgreSQL, para que o JPA saiba "falar" com o banco
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Acao a ser tomada no schema do banco de dados ao iniciar a aplicacao
# 'update': O Hibernate tentara atualizar o schema (criar/alterar tabelas) com base nas suas entidades Java.
# otimo para desenvolvimento. Para producao, usa-se 'validate' ou 'none'.
spring.jpa.hibernate.ddl-auto=update

# Mostra no console o SQL que o Hibernate esta a executar por baixo dos panos.
# Muito util para depuracao durante o desenvolvimento.
spring.jpa.show-sql=true

# Formata o SQL exibido no console para ser mais legivel.
spring.jpa.properties.hibernate.format_sql=true

# Chave secreta para assinatura dos tokens JWT
# Em um projeto real, isso deve vir de uma variavel de ambiente!
api.security.token.secret=minha-chave-secreta-super-dificil

# Configuração de Datasource para o Heroku
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${JDBC_DATABASE_USERNAME}
spring.datasource.password=${JDBC_DATABASE_PASSWORD}
